<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>想法星云</title>
<!-- 🔴 必须用 ./ 相对路径：站点在 github.io/ideas/ 这个子路径下，
     写成 /styles.css 会指到域名根，直接 404。 -->
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<header class="bar">
  <span id="space-name" class="space-name">…</span>
  <span id="space-count" class="space-count">0 条</span>
</header>

<main class="stage">
  <ol id="list" class="list" aria-label="想法清单"></ol>
</main>

<footer class="dock">
  <p id="notice" class="notice" role="status" aria-live="polite"></p>
  <textarea
    id="input"
    class="input"
    rows="1"
    placeholder="想到什么，扔进来…（回车记下，Shift+回车换行）"
    aria-label="记一条想法"></textarea>
  <div class="devrow">
    <button id="selftest" type="button" class="btn">自检</button>
    <pre id="selftest-out" class="selftest-out"></pre>
  </div>
</footer>

<!-- 🔴 同样必须是 ./ 相对路径 -->
<script src="./app.js"></script>
</body>
</html>

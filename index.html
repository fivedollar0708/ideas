<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>想法星云</title>
<!-- 🔴 必须用 ./ 相对路径：站点在 github.io/ideas/ 这个子路径下，
     写成 /styles.css 会指到域名根，直接 404。 -->
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- 星云画布。点心泡泡进空间浮层；滚轮缩放；拖空白平移；双击空白回全貌 -->
<div id="stage">
  <!-- 🔴 #world 是 0 尺寸的变换容器：它只负责承载 translate+scale，
       泡泡是它的绝对定位子元素，靠 overflow 溢出显示。
       这样"点空白"的 target 才会是 #stage，不会被子元素挡住。 -->
  <div id="world"></div>
  <!-- 其他空间也有命中时的提示条（贴在星云边缘）。点它切过去，搜索词保留 -->
  <button id="search-hint" class="search-hint" type="button" hidden></button>
</div>

<!-- 空间切换浮层 -->
<div id="space-layer" class="layer" hidden>
  <div class="layer-backdrop"></div>
  <div class="layer-panel" role="dialog" aria-label="切换空间">
    <h2 class="layer-title">切换空间</h2>
    <div class="space-list"></div>
    <div class="layer-actions">
      <button id="space-create" class="btn" type="button">新建空间</button>
      <button id="space-trash" class="btn" type="button">回收站</button>
    </div>
  </div>
</div>

<!-- 回收站浮层 -->
<div id="trash-layer" class="layer" hidden>
  <div class="layer-backdrop"></div>
  <div class="layer-panel" role="dialog" aria-label="回收站">
    <h2 class="layer-title">回收站</h2>
    <p class="trash-hint">30 天后自动清除。恢复会把空间连同里面所有想法一起带回来。</p>
    <ul class="trash-list"></ul>
    <p class="trash-empty" hidden>回收站是空的</p>
    <div class="layer-actions">
      <button id="trash-close" class="btn" type="button">关闭</button>
      <button id="trash-empty-btn" class="btn btn--danger" type="button">清空回收站</button>
    </div>
  </div>
</div>

<footer class="dock">
  <p class="meta">
    <span id="space-name" class="space-name">…</span>
    <span id="space-count" class="space-count">0 条</span>
  </p>
  <div class="searchrow">
    <input
      id="search"
      class="search-input"
      type="search"
      placeholder="⌕ 搜索想法…"
      autocomplete="off"
      spellcheck="false"
      aria-label="搜索想法">
    <span id="search-count" class="search-count" aria-live="polite"></span>
  </div>
  <p id="notice" class="notice" role="status" aria-live="polite"></p>
  <textarea
    id="input"
    class="input"
    rows="1"
    placeholder="想到什么，扔进来…（回车记下，Shift+回车换行）"
    aria-label="记一条想法"></textarea>
  <div class="devrow">
    <button id="selftest" type="button" class="btn">自检</button>
    <pre id="selftest-out" class="selftest-out"></pre>
  </div>
</footer>

<!-- 🔴 同样必须是 ./ 相对路径 -->
<script src="./app.js"></script>
</body>
</html>
